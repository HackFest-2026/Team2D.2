version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      - AGENT_TOKEN=${AGENT_TOKEN}
      POSTGRES_USER: threatshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: threatshield
    ports:
      - "5432:5432"
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - AGENT_TOKEN=${AGENT_TOKEN}
      - DATABASE_URL=postgresql://threatshield:${POSTGRES_PASSWORD}@db:5432/threatshield
    depends_on:
      - db
